# Perfil de desarrollo: base de datos H2 en memoria.
# Permite ejecutar y probar el módulo sin instalar MySQL.
spring:
  datasource:
    url: jdbc:h2:mem:pccompare;DB_CLOSE_DELAY=-1;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
